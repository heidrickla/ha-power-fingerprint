name: Validate

# A push runs the lint job alone. Anything that installs Home Assistant is
# workflow_dispatch only.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint and structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        timeout-minutes: 15

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        timeout-minutes: 15
        with:
          python-version: "3.14"

      # A venv of the job's own: the image's Python is externally managed, and
      # the runner's toolcache Python carries other repos' packages.
      # Pinned: an unpinned linter makes CI non-reproducible.
      - name: Install ruff and PyYAML (PINNED)
        timeout-minutes: 15
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --quiet "ruff==0.15.21" "PyYAML==6.0.2"
          "$RUNNER_TEMP/venv/bin/python" -m ruff --version

      - name: Ruff
        timeout-minutes: 15
        run: |
          "$RUNNER_TEMP/venv/bin/python" -m ruff check .
          "$RUNNER_TEMP/venv/bin/python" -m ruff format --check .

      - name: JSON is valid
        timeout-minutes: 15
        run: |
          for f in custom_components/power_fingerprint/*.json hacs.json; do
            "$RUNNER_TEMP/venv/bin/python" -c "import json,sys; json.load(open(sys.argv[1],encoding='utf-8'))" "$f" || exit 1
          done
          echo "all JSON valid"

      - name: Manifest sanity
        timeout-minutes: 15
        run: |
          "$RUNNER_TEMP/venv/bin/python" - <<'PY'
          import json
          m = json.load(open("custom_components/power_fingerprint/manifest.json", encoding="utf-8"))
          missing = [k for k in ("domain","name","version","documentation","codeowners") if not m.get(k)]
          assert not missing, f"manifest missing: {missing}"
          assert m["domain"] == "power_fingerprint", m["domain"]
          # A custom integration without a version silently fails to load.
          assert m["version"], "version is required for a custom integration"
          print("manifest ok:", m["domain"], m["version"])
          PY

      - name: Quality scale is complete and honest
        timeout-minutes: 15
        run: |
          "$RUNNER_TEMP/venv/bin/python" - <<'PY'
          import json, yaml
          rules = yaml.safe_load(open(
              "custom_components/power_fingerprint/quality_scale.yaml", encoding="utf-8"))["rules"]
          todo = sorted(k for k, v in rules.items()
                        if isinstance(v, dict) and v.get("status") == "todo")
          for name, v in rules.items():
              if isinstance(v, dict):
                  assert v.get("status") in {"done","todo","exempt"}, name
                  assert str(v.get("comment","")).strip(), f"{name}: needs a reason"
              else:
                  assert v == "done", name
          claimed = json.load(open(
              "custom_components/power_fingerprint/manifest.json", encoding="utf-8")
          ).get("quality_scale")
          assert not (claimed and todo), f"manifest claims {claimed} with todo: {todo}"
          print(f"{len(rules)} rules; still todo: {', '.join(todo) or 'none'}")
          PY

  # Installs Home Assistant, so it is manual only and does not run on an
  # ordinary push. This is the job that runs tests/ha/.
  home-assistant:
    name: Home Assistant layer
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      # Full history and tags, for the same reason as the GitHub workflow: the
      # default --no-tags --depth=1 leaves `git describe --tags` with nothing
      # to find, and the released-version check then notes that it could not
      # compare rather than running.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        timeout-minutes: 15
        with:
          fetch-depth: 0
          fetch-tags: true

      # Home Assistant 2026.x needs 3.14.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        timeout-minutes: 15
        with:
          python-version: "3.14"

      # The same pins as .github/workflows/tests.yml: 0.13.357 carries Home
      # Assistant 2026.8.3 and brings pytest, its plugins and pytest-cov.
      - name: Install
        timeout-minutes: 15
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet "mypy==1.18.2" \
            "pytest-homeassistant-custom-component==0.13.357"

      - name: Pure tests
        timeout-minutes: 15
        run: python -m pytest --durations=15 --junitxml=reports/junit-1.xml tests -q --ignore=tests/ha -p no:homeassistant

      - name: Home Assistant layer tests
        timeout-minutes: 15
        run: >-
          python -m pytest --durations=15 --junitxml=reports/junit-2.xml tests/ha -q
          --cov=custom_components/power_fingerprint --cov-report=term-missing

      - name: mypy strict
        timeout-minutes: 15
        run: python -m mypy custom_components/power_fingerprint

      # No PF_INTERNAL_HOSTS, for the same reason as the GitHub workflow. Every
      # report redacts its match under CI, so the printed string is not the
      # reason: a report names the file and the line, which locates the string
      # in a tree that is also pushed to a public mirror, and a repository
      # secret is a second copy of the names outside the estate. The step
      # states that the name half did not run; the address, URL-host,
      # device-identifier and private-suffix rules run either way, each on a
      # control line first. A dispatch names no earlier commit, so no
      # PF_PUSH_RANGE is set and the step states that it covered no commit.
      # The bare-name and queued-commit halves are a workstation gate, run by
      # tools/hooks/pre-push.
      - name: Offline HACS and hassfest checks
        timeout-minutes: 15
        run: python tools/validate_local.py

      # each test's time and result, kept whatever the outcome: the forge shows no job log
      - name: test results
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3.2.1
        with:
          name: test-results-${{ github.job }}
          path: reports/
          retention-days: 14

  # No continue-on-error: a red hassfest check is a real failure, and
  # a step that cannot fail proves nothing.
  # hacs/action reads the repository through the GitHub API, so it cannot
  # check this tree here; .github/workflows/validate.yml runs it on GitHub.
  hassfest:
    name: hassfest
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        timeout-minutes: 15
      - uses: home-assistant/actions/hassfest@cd6f3635a740c84d8a14f6121a90068b8ece6bf6 # master, 2026-10-17
        timeout-minutes: 15

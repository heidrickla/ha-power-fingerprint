name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

# Every job is gated to GitHub. A mirror that reads .github/workflows as well
# skips them instantly and runs .gitea/workflows/validate.yml instead, so the
# same suite is not run twice.

jobs:
  tests:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      # Full history and tags. The default is --no-tags --depth=1, under which
      # `git describe --tags` finds nothing and the released-version check in
      # tools/validate_local.py notes that it could not compare instead of
      # running; the queued-commit scan needs the commits the push carried.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      # Home Assistant 2026.x needs Python 3.14.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      # 0.13.357 pins Home Assistant 2026.8.3, the release the development
      # install runs; it brings pytest, its asyncio and aiohttp plugins,
      # pytest-cov and PyYAML with it (pinning those again here makes pip's
      # resolution impossible).
      - run: |
          python -m pip install --upgrade pip
          python -m pip install "mypy==1.18.2" "ruff==0.15.21" \
            "pytest-homeassistant-custom-component==0.13.357"
      - run: ruff check .
      - run: ruff format --check .
      # The pure modules import nothing from Home Assistant; the harness
      # plugin is disabled so its autouse fixtures do not attach to them.
      # Measured with coverage but reported by the second run: the gate is on
      # the union of the two suites, since each covers what the other cannot.
      - run: >-
          python -m pytest tests -q --ignore=tests/ha -p no:homeassistant
          --cov=custom_components/power_fingerprint --cov-report=
      # The Home Assistant layer, appended to the same coverage data, and the
      # gate the test-coverage rule asks for.
      - run: >-
          python -m pytest tests/ha -q
          --cov=custom_components/power_fingerprint --cov-append
          --cov-report=term-missing --cov-fail-under=95
      # The full strict block, with Home Assistant importable: the run that
      # means something. Locally without Home Assistant every HA class is Any.
      - run: python -m mypy custom_components/power_fingerprint
      # The range this event carries, for the queued-commit half of the host
      # scan. A derived range cannot answer here: the checkout points
      # refs/remotes/origin/main at the commit it checked out, so
      # origin/main..HEAD resolves and is empty however many commits the push
      # carried. A first push to a ref reports an all-zero before and sets no
      # range, and the run then states that it covered no commit.
      - name: The commit range this event carries
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          zero=0000000000000000000000000000000000000000
          # A force-push names a `before` the new history does not contain, so
          # the endpoint is tested rather than trusted. An unresolvable range is
          # a failure in the validator, which is right for a range somebody
          # typed and wrong for one this step derived.
          usable() {
            git cat-file -e "$1^{commit}" 2>/dev/null &&
              git merge-base --is-ancestor "$1" "$HEAD_SHA" 2>/dev/null
          }
          if [ -n "$BASE" ] && usable "$BASE"; then
            echo "PF_PUSH_RANGE=$BASE..$HEAD_SHA" >> "$GITHUB_ENV"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "$zero" ] && usable "$BEFORE"; then
            echo "PF_PUSH_RANGE=$BEFORE..$HEAD_SHA" >> "$GITHUB_ENV"
          else
            echo "no earlier commit this checkout can reach, so no range is set"
          fi
      # No PF_INTERNAL_HOSTS. Every report redacts its match under CI, so the
      # printed string is not the reason: a report names the file and the line,
      # which on a public repository locates the string whether or not the
      # string itself is printed, and a repository secret is a second copy of
      # the names outside the estate. The step states that the name half did
      # not run. The address, URL-host, device-identifier and private-suffix
      # rules need no name and run over the tree and over the commits in
      # PF_PUSH_RANGE, each on a control line first, so a clean result is not a
      # matcher that stopped matching. The bare-name rule is a workstation
      # gate, run by tools/hooks/pre-push.
      - run: python tools/validate_local.py

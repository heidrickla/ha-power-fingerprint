name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

# Gitea's act_runner also picks up .github/workflows, so every job here is
# gated to GitHub. On the gitea forge these skip instantly and
# .gitea/workflows/validate.yml is the one that runs - the runner is shared
# with capacity 1 and duplicate jobs queue behind each other.

jobs:
  pytest:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip pytest
      # The analysis, fingerprint and attribution modules import nothing from
      # Home Assistant precisely so they can be tested without installing it.
      - run: python -m pip install pyyaml
      - run: python tools/validate_local.py
      - run: python -m pytest tests/ -q

  lint:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip ruff
      - run: ruff check custom_components tools tests
      - run: ruff format --check custom_components tools tests

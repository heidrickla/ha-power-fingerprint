[project]
name = "ha-power-fingerprint"
# Kept equal to manifest.json and const.VERSION; tools/validate_local.py checks.
version = "0.17.0"
description = "Identify what is running on a circuit from the shape of its load."
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["custom_components/power_fingerprint/brand"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "W",    # warnings
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "RUF",
]
ignore = [
    # The tools deliberately load integration modules by path rather than by
    # package import, because the package __init__ pulls in Home Assistant and
    # these run on a workstation without it. That means imports after code.
    "E402",
]

[tool.ruff.lint.per-file-ignores]
# Tests load modules by path before importing them, and assert on constants.
"tests/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# pytest-homeassistant-custom-component's `hass` fixture is async, and pytest
# does not handle async fixtures natively. Without this every tests/ha test
# errors with "requested an async fixture with no plugin or hook that handled
# it" rather than failing on anything real.
asyncio_mode = "auto"

# `strict-typing` is the Platinum rule that has actual teeth: Home Assistant
# runs mypy in strict mode over integrations that claim it. This is the full
# strict block, with nothing relaxed. It means something only with Home
# Assistant installed, which is how the GitHub Tests workflow runs it; on a
# workstation without Home Assistant every HA class is Any and the run reports
# subclassing-Any noise that says nothing about this integration.
[tool.mypy]
# Home Assistant 2026.x is written for 3.14 (parenthesis-free except
# expressions and the like); a lower target makes mypy stop at HA's own
# source before it reaches this integration.
python_version = "3.14"
strict = true
warn_return_any = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_reexport = true
# The analysis layer is deliberately importable without Home Assistant, and
# the tools run on a workstation without it. Missing HA stubs must not be
# reported as errors in the integration's own code.
ignore_missing_imports = true
follow_imports = "silent"

[[tool.mypy.overrides]]
module = "tests.*"
strict = false
disallow_untyped_defs = false

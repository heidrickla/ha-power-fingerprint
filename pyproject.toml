[project]
name = "ha-power-fingerprint"
version = "0.4.0"
description = "Identify what is running on a circuit from the shape of its load."
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["custom_components/power_fingerprint/brand"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "W",    # warnings
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "RUF",
]
ignore = [
    # The tools deliberately load integration modules by path rather than by
    # package import, because the package __init__ pulls in Home Assistant and
    # these run on a workstation without it. That means imports after code.
    "E402",
]

[tool.ruff.lint.per-file-ignores]
# Tests load modules by path before importing them, and assert on constants.
"tests/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# `strict-typing` is the Platinum rule that has actual teeth: Home Assistant
# runs mypy in strict mode over integrations that claim it. The settings below
# mirror the strict block core applies to a strict-typed integration.
[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
# Off, and only because Home Assistant is absent: the ignores this file needs
# locally (see config_flow.py) are exactly the ones that become unnecessary
# once HA is importable, so warning about unused ignores would make the run
# fail in CI instead. Better to lose the unused-ignore warning than to switch
# off a whole error code for a file.
warn_unused_ignores = false
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_reexport = true
# Home Assistant itself is not installed on every machine this is linted from,
# and the analysis layer is deliberately importable without it. Missing HA
# stubs must not be reported as errors in the integration's own code.
ignore_missing_imports = true
follow_imports = "silent"
# ⚠ THESE TWO ARE RELAXED ONLY BECAUSE HOME ASSISTANT IS NOT INSTALLED HERE.
# Without HA's own package on the path every class it exports is `Any`, so
# subclassing Entity or DataUpdateCoordinator reads as "subclassing Any" and
# `@callback` reads as an untyped decorator. Both check families are noise in
# that state and neither says anything about this integration's own types.
# Everything else stays strict, including warn_return_any.
disallow_subclassing_any = false
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = "tests.*"
strict = false
disallow_untyped_defs = false

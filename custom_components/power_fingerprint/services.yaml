learn:
  fields:
    circuits:
      required: false
      selector:
        entity:
          domain: sensor
          device_class: power
          multiple: true
    days:
      required: false
      default: 7
      selector:
        number:
          min: 1
          max: 30
          unit_of_measurement: days
          mode: slider
    threshold:
      required: false
      selector:
        number:
          min: 0.1
          max: 5.0
          step: 0.1
          mode: box

label:
  fields:
    circuit:
      required: true
      selector:
        entity:
          domain: sensor
          device_class: power
    current_label:
      required: true
      selector:
        text:
    new_label:
      required: true
      selector:
        text:

verify_circuit:
  fields:
    device:
      required: true
      selector:
        entity:
          domain:
            - switch
            - light
    power_sensor:
      required: false
      selector:
        entity:
          domain: sensor
          device_class: power
    probes:
      required: false
      selector:
        number:
          min: 1
          max: 5
          mode: slider
    settle:
      required: false
      default: 30
      selector:
        number:
          min: 10
          max: 120
          unit_of_measurement: seconds
          mode: slider
    force:
      selector:
        boolean:
      default: false
    pause_automations:
      required: false
      default: false
      selector:
        boolean:

map_devices:
  fields:
    days:
      selector:
        number:
          min: 1
          max: 14
          mode: box
      default: 3
    step:
      selector:
        number:
          min: 1
          max: 300
          mode: box
    min_correlation:
      selector:
        number:
          min: 0
          max: 1
          step: 0.05
          mode: box

autolabel:

apply_circuit_labels:
  fields:
    dry_run:
      selector:
        boolean:
      default: true
    remove:
      selector:
        boolean:
      default: false
    prefix:
      selector:
        text:
      default: Circuit

record_breaker_evidence:
  fields:
    circuit:
      required: true
      selector:
        entity:
          domain: sensor
          device_class: power
    start:
      required: true
      selector:
        datetime:
    devices:
      required: false
      selector:
        object:
    answered:
      required: false
      selector:
        entity:
          multiple: true
    recovered:
      required: false
      selector:
        object:

correlate:
  fields:
    circuits:
      required: false
      selector:
        entity:
          domain: sensor
          device_class: power
          multiple: true
    days:
      required: false
      default: 7
      selector:
        number:
          min: 1
          max: 30
          unit_of_measurement: days
          mode: slider
    window:
      required: false
      default: 30
      selector:
        number:
          min: 10
          max: 300
          unit_of_measurement: s
          mode: box
    include_named:
      required: false
      default: false
      selector:
        boolean:
    limit:
      required: false
      default: 5
      selector:
        number:
          min: 1
          max: 20
          mode: box

set_device_power:
  fields:
    device_id:
      required: true
      selector:
        device:
    kind:
      required: false
      selector:
        select:
          options:
            - load
            - switch
            - sensor
          translation_key: device_kind
    typical_w:
      required: false
      selector:
        number:
          min: 0
          max: 100000
          unit_of_measurement: W
          mode: box
    max_w:
      required: false
      selector:
        number:
          min: 0
          max: 100000
          unit_of_measurement: W
          mode: box
    source:
      required: false
      selector:
        text:
    remove:
      required: false
      default: false
      selector:
        boolean:

learn:
  name: Learn fingerprints
  description: >-
    Read history for each circuit, group the appliance runs it finds by shape,
    and store them as candidates. Returns a description of every shape found so
    you can tell which is which. Labels you have already applied are kept.
  fields:
    circuits:
      name: Circuits
      description: Limit to these power sensors. Defaults to all configured circuits.
      required: false
      selector:
        entity:
          domain: sensor
          device_class: power
          multiple: true
    days:
      name: Days of history
      description: How far back to read. More data gives steadier clusters.
      required: false
      default: 7
      selector:
        number:
          min: 1
          max: 30
          unit_of_measurement: days
          mode: slider
    threshold:
      name: Cluster threshold
      description: >-
        How different two runs must be to count as different appliances, in
        weighted log-power space. Lower splits more. 0.9 is a good start.
      required: false
      default: 0.9
      selector:
        number:
          min: 0.1
          max: 5.0
          step: 0.1
          mode: box

label:
  name: Name a fingerprint
  description: >-
    Turn a candidate into an identification. Clustering finds the recurring
    shapes but cannot name them - that needs someone who knows what is plugged
    in. Only named fingerprints are used to drive anything.
  fields:
    circuit:
      name: Circuit
      description: The power sensor the fingerprint was learned on.
      required: true
      selector:
        entity:
          domain: sensor
          device_class: power
    current_label:
      name: Current label
      description: The existing label, for example unnamed_0.
      required: true
      selector:
        text:
    new_label:
      name: New label
      description: What this appliance actually is, for example Dryer.
      required: true
      selector:
        text:

verify_circuit:
  name: Verify a circuit by switching a device
  description: >-
    Switch a device and watch which circuit moves. This settles by measurement
    what history can only infer. It ACTUATES the device - it will visibly switch
    and switch back, several times - and only switches and lights may be probed.
    The prior state is always restored, including if the probe fails partway.
  fields:
    device:
      name: Device to switch
      description: Only switch and light entities may be probed.
      required: true
      selector:
        entity:
          domain:
            - switch
            - light
    power_sensor:
      name: The device's own power sensor
      description: >-
        Strongly recommended. With it, the circuit's step is compared against
        what the device says it drew, which is what rejects an unrelated load
        that happened to switch at the same moment.
      required: false
      selector:
        entity:
          domain: sensor
          device_class: power
    probes:
      name: Number of probes
      description: >-
        How many times to switch it. All probes must agree; one toggle can
        coincide with a fridge starting, two cannot.
      required: false
      default: 2
      selector:
        number:
          min: 1
          max: 5
          mode: slider
    settle:
      name: Settle time
      description: >-
        Seconds to wait for the meter after each switch. An Emporia reports
        about every 12 seconds, so this must comfortably exceed that.
      required: false
      default: 30
      selector:
        number:
          min: 10
          max: 120
          unit_of_measurement: seconds
          mode: slider
